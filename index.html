<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mojones projects</title>
  <style>
    :root {
      --bg: #f3f0e8;
      --fg: #111;
      --line: #111;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      background: var(--bg);
      color: var(--fg);
      font-family: "Courier New", Courier, monospace;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      border: 3px solid var(--line);
      padding: 20px;
      background: rgba(255, 255, 255, 0.45);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 0.9;
      text-transform: uppercase;
      letter-spacing: -0.05em;
    }

    p,
    li {
      font-size: 1rem;
      line-height: 1.5;
    }

    ul {
      padding-left: 20px;
    }

    a {
      color: inherit;
    }
  </style>
</head>
<body>
  <main>
    <h1>Projects</h1>
    <p>This is the root site for project pages hosted under path-based GitHub Pages URLs.</p>
    <ul>
      <li><a href="/333/">3/3/3</a></li>
    </ul>
  </main>
</body>
</html>
